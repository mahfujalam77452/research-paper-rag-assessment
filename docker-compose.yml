version: '3.8'

services:
  # Only Qdrant Vector Database (since MongoDB is in cloud)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research_papers_qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local